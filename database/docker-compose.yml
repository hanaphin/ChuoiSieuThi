services:
  oracle23ai:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle23ai_chuoi_sieuthi
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=Oracle23ai_Password#
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./scripts_init:/container-entrypoint-initdb.d
    restart: always

volumes:
  oracle_data:
